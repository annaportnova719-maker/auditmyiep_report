<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Match the device light/dark setting, like the landing page. In dark
         mode the whole app uses the brand's deep-green theme; in light mode it
         stays light. The inline style paints the green immediately (no white
         flash before the app loads); the script keeps the <html> class in sync. -->
    <style>
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]), html:not([data-theme="light"]) body { background: #0E1C17; }
      }
    </style>
    <script>
      (function () {
        try {
          var mq = window.matchMedia('(prefers-color-scheme: dark)');
          var apply = function (e) { document.documentElement.classList.toggle('dark', e.matches); };
          apply(mq);
          if (mq.addEventListener) mq.addEventListener('change', apply);
          else if (mq.addListener) mq.addListener(apply);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <title>AuditMyIEP — Know what your child's IEP promises</title>
    <meta name="description" content="Upload your child's IEP and get a clear, plain-language audit — scores, section-by-section findings, and the exact words to advocate for your child. Not legal advice." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
